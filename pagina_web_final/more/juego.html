<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de mecanografía</title>

    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <section class="juego">
        <div class="contenedor">

            <div class="juego-box">

                <div class="top-bar">
                    <div class="stat">⏱ Tiempo: <span id="tiempo">60</span>s</div>
                    <div class="stat">⚡ PPM: <span id="ppm">0</span></div>
                    <div class="stat">🎯 Precisión: <span id="precision">100%</span></div>
                </div>

                <div id="texto"></div>

                <input
                    type="text"
                    id="input"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    placeholder="Escribe la frase y pulsa ENTER..."
                >

            </div>

        </div>
    </section>

    <script src="../js/juego.js"></script>

</body>

</html>

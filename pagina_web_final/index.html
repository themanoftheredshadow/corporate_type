<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorporateType</title>

    <link rel="stylesheet" href="styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <header class="header">
        <div class="contenedor nav">
            <div class="logo">CorporateType</div>
        </div>
    </header>

    <section class="hero">
        <div class="contenedor hero-grid">

            <div class="hero-texto">
                <span class="badge">Plataforma profesional</span>
                <h1>Aprende mecanografía moderna</h1>
                <p>
                    Mejora velocidad, precisión y productividad
                    con ejercicios inteligentes y niveles progresivos.
                </p>
                <a href="more/niveles.html" class="btn btn-primary">Comenzar</a>
            </div>

            <div class="hero-card">
                <h3>Estadísticas globales</h3>
                    <div class="metric">
                        <span>Usuarios</span>
                        <span>+15K</span>
                    </div>
                    <div class="metric">
                        <span>Promedio</span>
                        <span>89 PPM</span>
                    </div>
                    <div class="metric">
                        <span>Precisión</span>
                        <span>97%</span>
                    </div>
                </div>

            </div>
    </section>

</body>

</html>
